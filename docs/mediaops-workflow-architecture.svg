<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800" role="img" aria-labelledby="title desc">
  <title id="title">MediaOps CoPilot incident-response workflow</title>
  <desc id="desc">A clear top-to-bottom workflow showing monitoring, parallel diagnosis, guarded remediation, execution, verification, fallback, and terminal outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#94a3b8"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#4ade80"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#fb7185"/></marker>
    <style>
      .title{font:700 36px Inter,system-ui,sans-serif;fill:#f8fafc}.subtitle{font:400 16px Inter,system-ui,sans-serif;fill:#94a3b8}
      .heading{font:700 17px Inter,system-ui,sans-serif;fill:#f8fafc;text-anchor:middle}.body{font:400 13px Inter,system-ui,sans-serif;fill:#bdc9d8;text-anchor:middle}
      .small{font:600 12px Inter,system-ui,sans-serif;fill:#cbd5e1;text-anchor:middle}.step{font:700 11px Inter,system-ui,sans-serif;fill:#7dd3fc;text-anchor:middle;letter-spacing:1px}
      .box{rx:12;stroke-width:1.7;filter:url(#shadow)}.det{fill:#102944;stroke:#38bdf8}.ai{fill:#2a1d46;stroke:#a78bfa}.memory{fill:#1c2939;stroke:#94a3b8}
      .success{fill:#103326;stroke:#4ade80}.stop{fill:#3a1820;stroke:#fb7185}.line{fill:none;stroke:#94a3b8;stroke-width:2.3;marker-end:url(#arrow)}
      .green{fill:none;stroke:#4ade80;stroke-width:2.7;marker-end:url(#greenArrow)}.red{fill:none;stroke:#fb7185;stroke-width:2.7;marker-end:url(#redArrow)}
    </style>
  </defs>
  <rect width="1400" height="1800" fill="url(#bg)"/><rect width="1400" height="8" fill="url(#accent)"/>
  <text x="60" y="60" class="title">MediaOps CoPilot</text><text x="60" y="90" class="subtitle">Complete autonomous incident-response workflow</text>

  <g transform="translate(835 38)"><rect width="505" height="65" rx="12" fill="#0b1525" stroke="#2c3b50"/>
    <circle cx="28" cy="24" r="7" fill="#a78bfa"/><text x="43" y="28" class="subtitle">AI judgment</text>
    <circle cx="165" cy="24" r="7" fill="#38bdf8"/><text x="180" y="28" class="subtitle">Deterministic authority</text>
    <circle cx="365" cy="24" r="7" fill="#4ade80"/><text x="380" y="28" class="subtitle">Success</text>
    <circle cx="445" cy="24" r="7" fill="#fb7185"/><text x="460" y="28" class="subtitle">Stop</text>
    <text x="252" y="52" class="small">AI proposes · deterministic code decides</text></g>

  <!-- Straight central flow -->
  <rect x="525" y="135" width="350" height="82" class="box det"/><text x="700" y="158" class="step">1 · CONTINUOUS MONITORING</text><text x="700" y="181" class="heading">Infra Health Monitor</text><text x="700" y="202" class="body">Confirms unhealthy telemetry is sustained</text>
  <path d="M700 217V253" class="line"/>
  <rect x="525" y="255" width="350" height="82" class="box det"/><text x="700" y="278" class="step">2 · DETECTION</text><text x="700" y="301" class="heading">Incident Recorder</text><text x="700" y="322" class="body">Creates an incident ID in Firestore</text>
  <path d="M700 337V373" class="line"/>
  <rect x="525" y="375" width="350" height="76" class="box det"/><text x="700" y="399" class="step">3 · COORDINATION</text><text x="700" y="424" class="heading">Orchestrator starts investigation</text><text x="700" y="442" class="body">Coordinates without bypassing guardrails</text>

  <!-- Parallel diagnosis -->
  <path d="M700 451V485H405V510" class="line"/><path d="M700 451V485H995V510" class="line"/><text x="700" y="480" class="small">RUN IN PARALLEL</text>
  <rect x="250" y="512" width="310" height="92" class="box ai"/><text x="405" y="536" class="step">4A · VIDEO WITNESS</text><text x="405" y="561" class="heading">Vision Agent</text><text x="405" y="582" class="body">Gemini identifies the visible symptom</text>
  <rect x="840" y="512" width="310" height="92" class="box ai"/><text x="995" y="536" class="step">4B · METRICS WITNESS</text><text x="995" y="561" class="heading">Infra Agent</text><text x="995" y="582" class="body">Gemini classifies infrastructure evidence</text>
  <path d="M405 604V638H620V665" class="line"/><path d="M995 604V638H780V665" class="line"/>

  <!-- Evidence decision -->
  <polygon points="700,650 875,710 700,770 525,710" class="det" filter="url(#shadow)"/><text x="700" y="687" class="step">5 · EVIDENCE CONFIRMATION</text><text x="700" y="712" class="heading">Do both witnesses agree?</text><text x="700" y="734" class="body">Evidence Aggregator validates corroboration</text>
  <path d="M875 710H1010" class="red"/><text x="942" y="697" class="small">NO</text>
  <rect x="1015" y="668" width="300" height="84" class="box stop"/><text x="1165" y="699" class="heading">ESCALATED</text><text x="1165" y="721" class="body">Evidence conflicts or is incomplete</text><text x="1165" y="739" class="body">Persist reason and stop safely</text>
  <path d="M700 770V806" class="green"/><text x="735" y="795" class="small">YES</text>

  <rect x="525" y="808" width="350" height="82" class="box memory"/><text x="700" y="831" class="step">6 · RETRIEVAL</text><text x="700" y="855" class="heading">Similar Past Incidents</text><text x="700" y="876" class="body">Retrieve relevant previous resolutions</text>
  <path d="M700 890V926" class="line"/>
  <rect x="525" y="928" width="350" height="84" class="box ai"/><text x="700" y="951" class="step">7 · PROPOSAL</text><text x="700" y="976" class="heading">Remediation Agent</text><text x="700" y="997" class="body">Gemini suggests one fixed enum action</text>
  <path d="M700 1012V1048" class="line"/>

  <!-- Safety Gate and bounded re-proposal -->
  <polygon points="700,1035 880,1100 700,1165 520,1100" class="det" filter="url(#shadow)"/><text x="700" y="1077" class="step">8 · DETERMINISTIC AUTHORITY</text><text x="700" y="1102" class="heading">Safety Gate</text><text x="700" y="1124" class="body">Did every safety check pass?</text>
  <path d="M880 1100H1008" class="red"/><text x="944" y="1087" class="small">FIRST BLOCK</text>
  <rect x="1012" y="1048" width="310" height="104" class="box ai"/><text x="1167" y="1072" class="step">ONE BOUNDED RETRY</text><text x="1167" y="1096" class="heading">Request a different proposal</text><text x="1167" y="1118" class="body">Give Remediation the block reason</text><text x="1167" y="1137" class="body">Then use the same Safety Gate</text>
  <path d="M1167 1152V1183" class="line"/>
  <polygon points="1167,1170 1302,1220 1167,1270 1032,1220" class="det" filter="url(#shadow)"/><text x="1167" y="1214" class="heading">Safety Gate again</text><text x="1167" y="1235" class="body">No checks weakened or bypassed</text>
  <path d="M1302 1220H1332V1360H1322" class="red"/><text x="1308" y="1207" class="small">BLOCK</text>
  <rect x="1012" y="1318" width="310" height="86" class="box stop"/><text x="1167" y="1349" class="heading">BLOCKED</text><text x="1167" y="1371" class="body">Record why · report · end automation</text><text x="1167" y="1389" class="body">Another incident may run</text>

  <!-- ALLOW routes converge -->
  <path d="M700 1165V1212" class="green"/><text x="735" y="1198" class="small">ALLOW</text>
  <path d="M1032 1220H930V1281H875" class="green"/><text x="970" y="1207" class="small">ALLOW</text>
  <rect x="525" y="1235" width="350" height="92" class="box det"/><text x="700" y="1258" class="step">9 · EXECUTION</text><text x="700" y="1283" class="heading">Control Plane</text><text x="700" y="1304" class="body">Claim idempotency key, then execute</text><text x="700" y="1321" class="body">Only ALLOW can reach this step</text>
  <path d="M525 1281H420" class="red"/><text x="473" y="1268" class="small">ERROR</text>
  <rect x="92" y="1239" width="325" height="84" class="box stop"/><text x="254" y="1270" class="heading">AUTOMATION_FAILED</text><text x="254" y="1292" class="body">Execution could not proceed safely</text><text x="254" y="1310" class="body">Persist reason and stop</text>
  <path d="M700 1327V1363" class="line"/>

  <!-- Verification decision -->
  <polygon points="700,1350 885,1418 700,1486 515,1418" class="det" filter="url(#shadow)"/><text x="700" y="1391" class="step">10 · INDEPENDENT VERIFICATION</text><text x="700" y="1417" class="heading">Is recovery proven?</text><text x="700" y="1439" class="body">Sustained metrics AND healthy video</text>
  <path d="M885 1418H1010" class="red"/><text x="947" y="1405" class="small">UNREADABLE</text>
  <rect x="1015" y="1376" width="300" height="84" class="box stop"/><text x="1165" y="1407" class="heading">CANNOT_VERIFY</text><text x="1165" y="1429" class="body">Unavailable evidence is not health</text><text x="1165" y="1447" class="body">Persist reason and stop</text>

  <!-- Recovery failure and one fallback -->
  <path d="M515 1418H418" class="red"/><text x="466" y="1405" class="small">FAILED</text>
  <rect x="85" y="1362" width="330" height="112" class="box det"/><text x="250" y="1387" class="step">ONE FALLBACK MAXIMUM</text><text x="250" y="1411" class="heading">Try one safe alternate</text><text x="250" y="1433" class="body">Different compatible action</text><text x="250" y="1452" class="body">Same Gate → Control → Verify</text>
  <path d="M250 1474V1510" class="line"/>
  <polygon points="250,1498 380,1547 250,1596 120,1547" class="det" filter="url(#shadow)"/><text x="250" y="1541" class="heading">Fallback outcome</text><text x="250" y="1562" class="body">Recovery independently verified?</text>
  <path d="M120 1547H92V1661H187" class="red"/><text x="88" y="1534" class="small">NO</text>
  <rect x="92" y="1618" width="325" height="86" class="box stop"/><text x="254" y="1649" class="heading">AUTOMATION_FAILED</text><text x="254" y="1671" class="body">No more automatic attempts</text><text x="254" y="1689" class="body">Persist reason and stop</text>

  <!-- Verified recovery and closure -->
  <path d="M700 1486V1522" class="green"/><text x="742" y="1511" class="small">RECOVERED</text>
  <path d="M380 1547H525" class="green"/><text x="452" y="1534" class="small">YES</text>
  <rect x="525" y="1524" width="350" height="82" class="box success"/><text x="700" y="1548" class="step">11 · RECOVERY</text><text x="700" y="1573" class="heading">Stream is healthy again</text><text x="700" y="1594" class="body">Recovery is proven, not assumed</text>
  <path d="M700 1606V1642" class="green"/>
  <rect x="525" y="1644" width="350" height="88" class="box success"/><text x="700" y="1667" class="step">12 · COMPLETE</text><text x="700" y="1692" class="heading">Report → KB Writeback → CLOSED</text><text x="700" y="1714" class="body">Notify Slack and save verified success</text>

  <rect x="165" y="1755" width="1070" height="30" rx="15" fill="#172033" stroke="#64748b"/><text x="700" y="1775" class="small">FIRESTORE · Every transition, finding, decision, result, and terminal reason is persisted</text>
</svg>
