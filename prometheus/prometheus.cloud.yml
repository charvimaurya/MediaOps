global:
  scrape_interval: 5s

# Grafana Cloud remote_write is appended to a runtime copy of this file by
# cloud/start.sh. Keeping credentials out of this tracked file prevents a
# Grafana access-policy token from ever entering the image or repository.
scrape_configs:
  - job_name: "media-simulator"
    static_configs:
      - targets:
          - "127.0.0.1:8000"
