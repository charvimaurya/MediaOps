services:

  prometheus:

    image: prom/prometheus:latest

    container_name: mediaops-prometheus

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    ports:
      - "9090:9090"

    extra_hosts:
      - "host.docker.internal:host-gateway"


  grafana:

    image: grafana/grafana:latest

    container_name: mediaops-grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer

    volumes:
      - grafana-storage:/var/lib/grafana
      - ./web/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./web/grafana/dashboards:/var/lib/grafana/dashboards:ro


volumes:

  grafana-storage:
